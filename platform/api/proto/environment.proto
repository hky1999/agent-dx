syntax = "proto3";

package adx.control.v1;

// Versioned internal Environment control. All callers authenticate with mTLS.
import public "environment_types.proto";
import public "snapshot.proto";
import public "credentials.proto";
import public "routes.proto";

service CoordinatorService {
  rpc WatchNodes(WatchNodesRequest) returns (stream NodeDirectory);
  rpc GetSchedulingQueue(GetSchedulingQueueRequest) returns (GetSchedulingQueueResponse);
  rpc SetNodeScheduling(SetNodeSchedulingRequest) returns (NodeSchedulingState);
  rpc PrepareCreate(LocalEnvironmentCreateRequest) returns (PreparedEnvironment);
  rpc ClaimEnvironment(ClaimEnvironmentRequest) returns (ClaimEnvironmentResponse);
  rpc ForwardCreate(LocalEnvironmentCreateRequest) returns (EnvironmentResult);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc InspectNode(InspectNodeRequest) returns (InspectNodeResponse);
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (EnvironmentResult);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  // Node-owned state decisions are persisted by Coordinator. This does not transfer
  // ownership of the Environment lifecycle to Coordinator.
  rpc CommitEnvironment(CommitEnvironmentRequest) returns (CommitEnvironmentResponse);
  // Reserves a replacement execution before the node performs physical work.
  rpc AuthorizeExecution(AuthorizeExecutionRequest) returns (AuthorizeExecutionResponse);
  // Reports exact physical state and obtains the center's durable memory decision.
  rpc ReconcileMemory(ReconcileMemoryRequest) returns (ReconcileMemoryResponse);
}

service NodeService {
  rpc CreateLocalEnvironment(LocalEnvironmentCreateRequest) returns (EnvironmentResult);
  rpc RecoverEnvironment(RecoverEnvironmentRequest) returns (EnvironmentResult);
  // Coordinator verifies the process currently serving an already registered address
  // before accepting a pre-timeout process replacement. Available during reconciliation.
  rpc GetSession(GetNodeSessionRequest) returns (GetNodeSessionResponse);
  rpc CreateEnvironment(StartAssignedEnvironmentRequest) returns (EnvironmentResult);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (EnvironmentResult);
  rpc PauseEnvironment(PauseEnvironmentRequest) returns (EnvironmentResult);
  rpc ResumeEnvironment(ResumeEnvironmentRequest) returns (EnvironmentResult);
  rpc UpdateNetworkPolicy(UpdateNetworkPolicyRequest) returns (EnvironmentResult);
  rpc ReloadEnvironment(ReloadEnvironmentRequest) returns (EnvironmentResult);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc CollectSnapshot(CollectSnapshotRequest) returns (CollectSnapshotResponse);
}

message RecoverEnvironmentRequest { EnvironmentRecord record = 1; string node_session_id = 2; }

message GetNodeSessionRequest {}

message GetNodeSessionResponse { string node_id = 1; string session_id = 2; }

message RegisterNodeRequest {
  string node_id = 1;
  string node_address = 2;
  Resources capacity = 3;
  bool accepting_allocations = 4;
  map<string,string> labels = 5;
  repeated Device devices = 6;
  string proxy_address = 7;
  string session_id = 8; // Unique for one Adxlet process lifetime.
  uint64 heartbeat_sequence = 9;
  bool reconciling = 10;
  uint32 memory_control_version = 12; // Version 1 supports elastic birth and conditional memory control.
  repeated string runtime_classes = 11; // Available classes discovered through sandboxd's UDS.

}

message RegisterNodeResponse { uint32 shard_id = 1; uint64 coordinator_epoch = 2; }

message CreateEnvironmentRequest {
  EnvironmentSpec spec = 1;
  CallerContext caller = 2;
  // Bounds only time waiting for a central scheduling assignment.
  uint64 schedule_timeout_seconds = 3;
  // Bounds the complete public create operation across local or central paths.
  uint64 create_timeout_seconds = 4;
}

message GetEnvironmentRequest { string environment_id = 1; CallerContext caller = 2; }

message GetEnvironmentResponse { EnvironmentRecord record = 1; string node_address = 2; string relay_address = 3; }

message StartAssignedEnvironmentRequest {
  ReusableSnapshot snapshot = 4;
  EnvironmentSpec spec = 1;
  Assignment assignment = 2;
  string node_session_id = 3;
}

message DeleteEnvironmentRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  // Coordinator GC only: the node rechecks Failed and revision in the serial lifecycle task.
  optional uint64 failed_revision = 3;
  string node_session_id = 4;
}

message CommitEnvironmentRequest { EnvironmentRecord record = 1; string node_session_id = 2; }

message CommitEnvironmentResponse { EnvironmentRecord record = 1; }

message InspectNodeRequest { string node_id = 1; string session_id = 2; bool history_reclamation = 3; bool include_history = 4; }

message InspectNodeResponse { repeated EnvironmentRecord records = 1; uint64 coordinator_epoch = 2; repeated ReusableSnapshot snapshots = 3; repeated RestorePoint retained_checkpoints = 4; HistoryBoundary history_boundary = 5; }

message PauseEnvironmentRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; uint64 ttl_seconds = 5; uint64 timeout_seconds = 6; CheckpointResources resources = 7; }

message ResumeEnvironmentRequest { Assignment assignment = 1; CallerContext caller = 2; string operation_id = 3; uint64 expected_revision = 4; }

message UpdateNetworkPolicyRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  // Absence clears the complete policy and restores unrestricted networking.
  NetworkPolicy network = 5;
}

message ReloadEnvironmentRequest {
  Assignment assignment = 1;
  CallerContext caller = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
}



// Node-local entry discovery. Every frame is a complete, bounded-lifetime view.
message WatchNodesRequest {}
message NodeEndpoint {
  string node_id = 1;
  string address = 2;
  string session_id = 3;
  Resources capacity = 4;
  Resources allocatable = 5;
  map<string,string> labels = 6;
  bool accepting_allocations = 7;
  repeated Device capacity_devices = 8;
  repeated Device allocatable_devices = 9;
  // Data-plane address paired with this node process. API Server uses it to
  // seed ownership after a successful node-local create without a Coordinator readback.
  string relay_address = 10;
}
// 宿主预算来自一次持久读取；节点离线不改变容量或占用。
message HostBudgetStatus {
  string host_id = 1;
  Resources capacity = 2;
  Resources held = 3;
  Resources available = 4;
  repeated string nodes = 5;
}
message NodeDirectory {
  uint64 epoch = 1;
  repeated NodeEndpoint nodes = 2;
  uint64 valid_for_millis = 3;
  repeated HostBudgetStatus host_budgets = 4;
  bool host_budget_configured = 5;
  // Epoch and revision identify the same atomic durable read as host_budgets.
  uint64 control_revision = 6;
}
message GetSchedulingQueueRequest {}
message PendingEnvironment { EnvironmentSpec spec = 1; uint64 enqueue_time_millis = 2; }
message GetSchedulingQueueResponse { repeated PendingEnvironment environments = 1; }
message SetNodeSchedulingRequest {
  string node_id = 1;
  bool accepting_allocations = 2;
  reserved 3;
}
message NodeSchedulingState { string node_id = 1; bool accepting_allocations = 2; }
message LocalEnvironmentCreateRequest { CreateEnvironmentRequest create = 1; string node_session_id = 2; }
message PreparedEnvironment { EnvironmentSpec spec = 1; ReusableSnapshot snapshot = 2; }
message ClaimEnvironmentRequest { EnvironmentSpec spec = 1; CallerContext caller = 2; string node_session_id = 3; repeated DeviceAllocation devices = 4; }
message ClaimEnvironmentResponse {
  oneof outcome {
    StartAssignedEnvironmentRequest owned = 1;
    GetEnvironmentResponse existing = 2;
    bool fallback = 3; // Definitive no-write result; safe to release this attempt's hold.
  }
}


// Complete source and request identity fence retries; expiry never releases a hold.
enum ExecutionKind {
  EXECUTION_KIND_UNSPECIFIED = 0;
  EXECUTION_KIND_RESUME = 1;
  EXECUTION_KIND_RESTART = 2;
  EXECUTION_KIND_RELOAD = 3;
  EXECUTION_KIND_FAILOVER = 4;
  EXECUTION_KIND_PAUSE_ROLLBACK = 5;
}
message ExecutionRequest {
  EnvironmentRecord source = 1;
  ExecutionKind kind = 2;
  string operation_id = 3;
  uint64 expected_revision = 4;
  uint64 timeout_millis = 5;
}
message ExecutionAuthorization {
  ExecutionRequest request = 1;
  EnvironmentRecord target = 2;
  string node_session_id = 3;
  uint64 coordinator_epoch = 4;
  uint64 issued_unix_millis = 5;
  uint64 deadline_unix_millis = 6;
}
message AuthorizeExecutionRequest { ExecutionRequest execution = 1; string node_session_id = 2; }
message AuthorizeExecutionResponse { ExecutionAuthorization authorization = 1; }

message MemoryIdentity {
  Assignment assignment = 1;
  string runtime_id = 2;
  string sandbox_id = 3;
  string resource_generation = 4;
}

message MemoryObservation {
  MemoryIdentity identity = 1;
  uint64 cpu_quota_usec = 2;
  uint64 cpu_period_usec = 3;
  uint64 memory_limit_bytes = 4;
  uint64 memory_high_bytes = 5;
  uint64 resource_revision = 6;
  string operation_id = 7;
  bool operation_pending = 8;
  bool frozen = 9;
}

message MemoryRequest {
  MemoryObservation source = 1;
  uint64 target_limit_bytes = 2;
  uint64 target_high_bytes = 3;
  string operation_id = 4;
  uint64 timeout_millis = 5;
}

message MemoryAuthorization {
  MemoryRequest request = 1;
  string node_session_id = 2;
  uint64 coordinator_epoch = 3;
  uint64 issued_unix_millis = 4;
  uint64 deadline_unix_millis = 5;
}

message MemoryPressure {
  uint64 high_events = 1;
  uint64 oom_events = 2;
  uint64 oom_kill_events = 3;
}

message MemorySample {
  MemoryObservation observation = 1;
  uint64 usage_bytes = 2;
  optional uint64 peak_bytes = 3;
  optional uint64 cpu_usage_ns = 4;
  MemoryPressure pressure = 5;
  uint64 observed_unix_millis = 6;
}

message MemoryDecision {
  MemoryObservation observed = 1;
  Resources held_resources = 2;
  MemoryAuthorization authorization = 3;
  string node_session_id = 4;
  uint64 coordinator_epoch = 5;
}

message ReconcileMemoryRequest { MemorySample sample = 1; string node_session_id = 2; }
message ReconcileMemoryResponse { MemoryDecision decision = 1; }

message HistoryProtection { Assignment assignment = 1; string specification_sha256 = 2; uint64 minimum_runtime_revision = 3; uint64 environment_revision = 4; }
message HistoryBoundary { string authority = 1; uint64 coordinator_epoch = 2; uint64 assignment_generation = 3; uint64 catalog_revision = 4; repeated HistoryProtection protected = 5; }
